name: Remove obsolete report button
on:
  push:
    paths:
      - 'manualequipe_remove_report.py'
      - '.github/workflows/manualequipe-remove-report.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python manualequipe_remove_report.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove obsolete PDF report control'
          git push
