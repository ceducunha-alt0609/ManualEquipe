name: ManualEquipe UI audit
on:
  push:
    paths:
      - 'manualequipe_ui_audit.py'
      - '.github/workflows/manualequipe-ui-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python manualequipe_ui_audit.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manualequipe_ui_audit_report.txt
          git diff --cached --quiet || git commit -m 'Generate ManualEquipe UI audit report'
          git push
