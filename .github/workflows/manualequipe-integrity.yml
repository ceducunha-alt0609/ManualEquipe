name: ManualEquipe integrity
on:
  push:
    paths:
      - 'manualequipe_patch_integrity.py'
      - '.github/workflows/manualequipe-integrity.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python manualequipe_patch_integrity.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Persist ManualEquipe progress and isolate PWA cache'
          git push
