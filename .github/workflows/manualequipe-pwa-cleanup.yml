name: ManualEquipe PWA cleanup
on:
  push:
    paths:
      - 'manualequipe_pwa_cleanup.py'
      - '.github/workflows/manualequipe-pwa-cleanup.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python manualequipe_pwa_cleanup.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.json manifest.webmanifest
          git diff --cached --quiet || git commit -m 'Clean ManualEquipe PWA metadata'
          git push
